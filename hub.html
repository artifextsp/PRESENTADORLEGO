<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Suite — Centro de Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Inter',system-ui,sans-serif;
      background:#06080f;color:#f1f5f9;padding:2rem;position:relative;overflow-x:hidden;
    }
    .glow1{position:fixed;top:-250px;left:-150px;width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.1),transparent 70%);pointer-events:none}
    .glow2{position:fixed;bottom:-250px;right:-150px;width:600px;height:600px;background:radial-gradient(circle,rgba(168,85,247,.08),transparent 70%);pointer-events:none}

    .brand{font-size:1.15rem;font-weight:900;letter-spacing:.06em;background:linear-gradient(135deg,#3b82f6,#06b6d4,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
    .subtitle{font-size:.82rem;color:#64748b;margin-bottom:2.2rem}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;width:100%;max-width:580px}

    .card{
      background:#0e1322;border:1px solid rgba(255,255,255,.07);border-radius:16px;
      padding:1.6rem 1.3rem;text-decoration:none;color:#f1f5f9;
      display:flex;flex-direction:column;align-items:center;text-align:center;
      cursor:pointer;transition:all .25s;position:relative;overflow:hidden;
    }
    .card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;border-radius:16px}
    .card:hover{transform:translateY(-4px)}
    .card:hover::before{opacity:1}

    .c1:hover{border-color:rgba(59,130,246,.4);box-shadow:0 8px 40px rgba(59,130,246,.15)}
    .c1::before{background:radial-gradient(circle at center,rgba(59,130,246,.08),transparent 70%)}
    .c2:hover{border-color:rgba(6,182,212,.4);box-shadow:0 8px 40px rgba(6,182,212,.15)}
    .c2::before{background:radial-gradient(circle at center,rgba(6,182,212,.08),transparent 70%)}
    .c3:hover{border-color:rgba(168,85,247,.4);box-shadow:0 8px 40px rgba(168,85,247,.15)}
    .c3::before{background:radial-gradient(circle at center,rgba(168,85,247,.08),transparent 70%)}
    .c4:hover{border-color:rgba(34,197,94,.4);box-shadow:0 8px 40px rgba(34,197,94,.15)}
    .c4::before{background:radial-gradient(circle at center,rgba(34,197,94,.08),transparent 70%)}

    .icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:.9rem}
    .i1{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.25)}
    .i2{background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.25)}
    .i3{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.25)}
    .i4{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.25)}

    .card h3{font-size:.88rem;font-weight:800;margin-bottom:.25rem;position:relative}
    .card p{font-size:.7rem;color:#94a3b8;line-height:1.5;position:relative}

    .link-row{
      display:flex;align-items:center;gap:.4rem;margin-top:.7rem;position:relative;
    }
    .link-btn{
      display:flex;align-items:center;gap:.3rem;padding:.25rem .55rem;border-radius:6px;
      font-size:.62rem;font-weight:700;border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.05);color:#94a3b8;cursor:pointer;
      transition:all .15s;font-family:inherit;
    }
    .link-btn:hover{background:rgba(255,255,255,.1);color:#f1f5f9}

    .divider{width:100%;max-width:580px;height:1px;background:rgba(255,255,255,.06);margin:1.8rem 0 1.2rem}

    .extras{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
    .extra-btn{
      display:flex;align-items:center;gap:.4rem;
      padding:.45rem .9rem;border-radius:9px;font-size:.75rem;font-weight:600;
      border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);
      color:#94a3b8;cursor:pointer;transition:all .2s;text-decoration:none;font-family:inherit;
    }
    .extra-btn:hover{background:rgba(255,255,255,.08);color:#f1f5f9;border-color:rgba(255,255,255,.15)}

    .toast{
      position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(12px);
      background:#0f172a;border:1px solid rgba(255,255,255,.15);border-radius:10px;
      padding:.55rem 1rem;font-size:.78rem;font-weight:600;color:#86efac;
      opacity:0;transition:all .2s;pointer-events:none;z-index:100;
      display:flex;align-items:center;gap:.4rem;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:500px){
      .grid{grid-template-columns:1fr;max-width:320px}
      body{padding:1.5rem 1rem}
    }
  </style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="brand">✦ AURORA SUITE</div>
  <div class="subtitle">Selecciona una herramienta</div>

  <div class="grid">

    <a class="card c1" href="plataforma.html">
      <div class="icon i1">✏️</div>
      <h3>Aurora 3D Editor</h3>
      <p>Crear y editar objetos 3D</p>
      <div class="link-row" onclick="event.preventDefault();event.stopPropagation();">
        <button class="link-btn" onclick="copyLink('viewer.html')" title="Copiar link del Viewer para jurados">🔗 Link Viewer</button>
      </div>
    </a>

    <a class="card c2" href="viewer.html">
      <div class="icon i2">👁️</div>
      <h3>Aurora 3D Viewer</h3>
      <p>Visualizar modelos 3D</p>
      <div class="link-row" onclick="event.preventDefault();event.stopPropagation();">
        <button class="link-btn" onclick="copyLink('viewer.html')" title="Copiar link para compartir">🔗 Copiar link</button>
      </div>
    </a>

    <a class="card c3" href="innovacion-fll/editor.html">
      <div class="icon i3">🌟</div>
      <h3>Aurora Nova</h3>
      <p>Armar presentaciones</p>
      <div class="link-row" onclick="event.preventDefault();event.stopPropagation();">
        <button class="link-btn" onclick="copyLink('innovacion-fll/viewer.html')" title="Copiar link del Viewer para jurados">🔗 Link Viewer</button>
      </div>
    </a>

    <a class="card c4" href="innovacion-fll/viewer.html">
      <div class="icon i4">▶️</div>
      <h3>Aurora Nova Viewer</h3>
      <p>Presentar ante el público</p>
      <div class="link-row" onclick="event.preventDefault();event.stopPropagation();">
        <button class="link-btn" onclick="copyLink('innovacion-fll/viewer.html')" title="Copiar link para compartir">🔗 Copiar link</button>
      </div>
    </a>

  </div>

  <div class="divider"></div>

  <div class="extras">
    <a class="extra-btn" href="manual-aurora.html">📖 Manual del equipo</a>
    <a class="extra-btn" href="interactivo-3d.html">🤖 Robot 3D</a>
    <a class="extra-btn" href="interactivo-imagen.html">🖼️ Imagen interactiva</a>
    <button class="extra-btn" onclick="copyLink('')">🔗 Link del Hub</button>
  </div>

  <div class="toast" id="toast">✅ Link copiado</div>

  <script>
    function getBaseUrl() {
      const loc = window.location;
      if (loc.hostname === 'localhost' || loc.hostname === '127.0.0.1' || loc.protocol === 'file:') {
        return 'https://artifextsp.github.io/PRESENTADORLEGO/presentacion-fll/';
      }
      const path = loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
      return loc.origin + path;
    }

    function copyLink(relativePath) {
      const url = getBaseUrl() + relativePath;
      navigator.clipboard.writeText(url).then(() => {
        showToast('✅ Link copiado: ' + (relativePath || 'Hub'));
      }).catch(() => {
        prompt('Copia este link:', url);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
